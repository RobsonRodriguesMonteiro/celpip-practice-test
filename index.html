function levelFor(score,table){for(const [lv,mn] of table){if(score>=mn)return lv;}return table[table.length-1][0];}
function renderResults(app){
  let lc=0,lt=0,rc=0,rt=0;
  DATA.listening.forEach((p,pi)=>p.questions.forEach((q,qi)=>{lt++;if(ANS[qId('L',pi,'q',qi)]===q.answer)lc++;}));
  DATA.reading.forEach((p,pi)=>{
    (p.questions||[]).forEach((q,qi)=>{rt++;if(ANS[qId('R',pi,'q',qi)]===q.answer)rc++;});
    if(p.response)p.response.blanks.forEach(b=>{rt++;if(ANS[qId('R',pi,'b',b.n)]===b.answer)rc++;});
  });
  const ll=levelFor(lc,DATA.scoreL), rl=levelFor(rc,DATA.scoreR);
  let h=`<div class="card"><div class="band">Resultados</div>
    <p class="lead">Listening e Reading são corrigidos automaticamente. Writing e Speaking não recebem nota
    automática — compare suas respostas com as respostas-modelo em cada módulo.</p>
    <div class="scorebox" style="margin-top:14px">
      <div class="sc"><div class="den">Listening</div><div class="big">${lc}<span style="font-size:20px">/${lt}</span></div>
        <div class="lvl">CELPIP ${ll}</div></div>
      <div class="sc"><div class="den">Reading</div><div class="big">${rc}<span style="font-size:20px">/${rt}</span></div>
        <div class="lvl">CELPIP ${rl}</div></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn" onclick="render()">🔄 Atualizar</button>
      <button class="btn sec" onclick="document.getElementById('teacher').click()">🔑 Alternar gabarito</button>
      <button class="btn sec" onclick="clearAll()">Limpar respostas</button>
    </div>
  </div>
  <div class="card"><div class="sub">Equivalência aproximada</div>
    <table class="dtable"><tr><td>CELPIP ${ll} (Listening)</td><td>${celpipMap(ll)}</td></tr>
    <tr><td>CELPIP ${rl} (Reading)</td><td>${celpipMap(rl)}</td></tr></table>
    <p class="small muted" style="margin-top:8px">Writing & Speaking: use as respostas-modelo e os
    <i>Performance Standards</i> para estimar seu nível (Target 5 ≈ CLB5/B1 · Target 9 ≈ CLB9/B2).</p>
  </div>`;
  app.innerHTML=h;
}
function celpipMap(l){const m={"10–12":"CLB 10–12 · C1–C2 · uso avançado","9":"CLB 9 · B2+ · muito bom",
  "8":"CLB 8 · B2","7":"CLB 7 · B2 inicial","6":"CLB 6 · B1+ (comum p/ imigração)",
  "5":"CLB 5 · B1","4":"CLB 4 · A2+","3":"CLB 3 · A2","M–2":"abaixo de CLB 3"};return m[l]||"";}

/* ---------------- shared UI ---------------- */
function navButtons(cur){
  const order=["listening","reading","writing","speaking","results"];
  const i=order.indexOf(cur);const prev=i>0?order[i-1]:"home";const next=order[i+1]||"results";
  return `<div class="card"><div class="row">
    <button class="btn sec" onclick="go('${prev}')">← Voltar</button>
    <button class="btn" onclick="go('${next}')">Próximo →</button>
  </div></div>`;
}
function markOne(id,ans){
  if(!TEACHER)return;
  document.querySelectorAll(`[data-opt="${id}"]`).forEach(el=>{
    const i=+el.dataset.i;el.classList.remove('correct','wrong');
    if(i===ans)el.classList.add('correct');
    else if(ANS[id]===i)el.classList.add('wrong');
  });
}
function markBlank(id,ans){
  if(!TEACHER)return;const el=document.getElementById('bl-'+id);if(!el)return;
  el.classList.remove('correct','wrong');
  if(ANS[id]==ans)el.classList.add('correct');else if(ANS[id]!=null)el.classList.add('wrong');
}
function toggle(id){const el=document.getElementById(id);if(el)el.classList.toggle('hidden');}
function countWords(taId,wcId){const ta=document.getElementById(taId);const wc=document.getElementById(wcId);
  if(!ta||!wc)return;const n=(ta.value.trim().match(/\S+/g)||[]).length;wc.textContent=n+" palavras";
  wc.style.color=(n>=150&&n<=200)?"var(--good)":"var(--mut)";}
function clearAll(){if(confirm("Apagar todas as respostas salvas?")){ANS={};store.set(ANS);render();}}

/* timers */
const TIMERS={};
function startTimer(id,mins){stopTimer(id);let s=mins*60;const el=document.getElementById(id);
  const tick=()=>{const m=Math.floor(s/60),ss=s%60;el.textContent=m+":"+String(ss).padStart(2,'0');
    el.classList.toggle('warn',s<=60);if(s<=0){stopTimer(id);el.textContent="0:00";}s--;};
  tick();TIMERS[id]=setInterval(tick,1000);}
function stopTimer(id){if(TIMERS[id]){clearInterval(TIMERS[id]);delete TIMERS[id];}}
function speakPrep(ti,prep,speak){const id='sck-'+ti;stopTimer(id);let s=prep;const el=document.getElementById(id);
  document.getElementById('sst-'+ti).textContent="preparando…";
  const tick=()=>{el.textContent="0:"+String(Math.max(s,0)).padStart(2,'0');el.classList.toggle('warn',s<=5);
    if(s<=0){stopTimer(id);speakGo(ti,speak);return;}s--;};tick();TIMERS[id]=setInterval(tick,1000);}
function speakGo(ti,speak){const id='sck-'+ti;stopTimer(id);let s=speak;const el=document.getElementById(id);
  const st=document.getElementById('sst-'+ti);st.textContent="🎙️ fale agora";st.style.color="var(--bad)";
  const tick=()=>{const m=Math.floor(s/60),ss=s%60;el.textContent=m+":"+String(ss).padStart(2,'0');
    el.classList.toggle('warn',s<=10);if(s<=0){stopTimer(id);st.textContent="tempo esgotado";st.style.color="var(--mut)";return;}s--;};
  tick();TIMERS[id]=setInterval(tick,1000);}

/* teacher mode */
function applyTeacher(){
  document.querySelectorAll('.expl').forEach(e=>e.classList.toggle('hidden',!TEACHER));
  document.querySelectorAll('.bexpl').forEach(e=>{e.classList.toggle('hidden',!TEACHER);e.style.display=TEACHER?'block':'none';});
  document.querySelectorAll('.transcript').forEach(e=>e.classList.toggle('hidden',!TEACHER));
  if(TEACHER){
    DATA.listening.forEach((p,pi)=>p.questions.forEach((q,qi)=>markOne(qId('L',pi,'q',qi),q.answer)));
    DATA.reading.forEach((p,pi)=>{(p.questions||[]).forEach((q,qi)=>markOne(qId('R',pi,'q',qi),q.answer));
      if(p.response)p.response.blanks.forEach(b=>markBlank(qId('R',pi,'b',b.n),b.answer));});
  } else {
    document.querySelectorAll('.opt').forEach(e=>e.classList.remove('correct','wrong'));
    document.querySelectorAll('.inlineblank').forEach(e=>e.classList.remove('correct','wrong'));
  }
}
document.getElementById('teacher').addEventListener('change',e=>{TEACHER=e.target.checked;render();});
